<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAME NIGHT｜ゲーム大会記録</title>
<style>
:root{
  --bg:#24262A; --bg2:#1E1F22; --panel:#F4F4F2; --ink:#1E1F22; --text:#EDEDED; --sub:#A9ADB4; --dim:#6B6E74;
  --line:#4A4D53; --row:rgba(54,57,62,.92); --dark:rgba(20,21,24,.88);
  --blue:#2E8FD8; --blue2:#4AA3E6; --gold:#F2C14E; --orange:#E06A2C; --red:#C8463C; --green:#5FD49A;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.5}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:14px 14px 40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit}
.mono{font-family:var(--mono)}
.cap{font-size:11px;letter-spacing:2px;color:var(--blue);margin:0 0 6px}
.capg{font-size:11px;letter-spacing:2px;color:#8A8D93;margin:0}
.muted{color:var(--sub)} .dim{color:var(--dim)}
.stripe{height:8px;width:110px;background:repeating-linear-gradient(-45deg,var(--gold) 0 6px,transparent 6px 12px)}
.tag{display:inline-block;background:var(--blue);color:#fff;padding:3px 14px 3px 10px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);font-size:13px;white-space:nowrap}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:14px}
.hd .l,.hd .r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ico{font-size:20px;line-height:1;color:var(--sub);padding:4px}
.ico:hover{color:var(--text)}
.pill{background:var(--blue);color:#fff;padding:1px 6px;font-size:11px}
.wp{background:var(--panel);color:var(--ink)}
.cut{clip-path:polygon(0 0,100% 0,100% 78%,96% 100%,0 100%)}
.top-o{border-top:3px solid var(--orange)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;padding:9px 18px;clip-path:polygon(0 0,100% 0,100% 70%,94% 100%,0 100%);font-size:15px}
.btn:hover{background:var(--blue2)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn2{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);color:#C4C7CC;padding:8px 14px;font-size:14px}
.btn2:hover{border-color:var(--sub);color:var(--text)}
.btn2.danger{border-color:#7a3b36;color:#F27C7C}
.field{width:100%;background:var(--dark);border:1px solid var(--line);color:var(--text);padding:9px 10px;outline:none}
.field:focus{border-color:var(--blue)}
.err{color:#F27C7C;font-size:13px;margin:6px 0 0;min-height:1em}
.grid2{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr);gap:16px}
@media (max-width:760px){.grid2,.linkgrid{grid-template-columns:1fr !important}}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tile{text-align:left;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-end;min-height:72px}
.tile .t{font-size:24px;font-weight:600;margin:0;line-height:1.2}
.tile:hover{filter:brightness(1.06)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span6{grid-column:span 6}
@media (max-width:520px){.span2{grid-column:span 3}.tile .t{font-size:20px}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--row);padding:8px 12px}
.rowcut{clip-path:polygon(0 0,100% 0,97% 100%,0 100%)}
.rk{min-width:36px;text-align:center;padding:4px 0;border:1px solid var(--line);font-family:var(--mono);font-size:15px;color:var(--text)}
.rk.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.rk.x{min-width:56px;font-size:12px;font-family:inherit}
.rk.x.on{background:#555;color:#fff;border-color:#777}
.ptile{text-align:left;padding:10px 12px;background:var(--row);border-left:4px solid transparent}
.ptile.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
.ptile .n{font-size:18px;font-weight:600;margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 6px;border-top:1px solid #34373C;text-align:left;font-weight:400}
th{color:#8A8D93;font-size:11px;border-top:0}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(255,255,255,.04)}
.bdg{background:var(--red);color:#fff;font-size:10px;padding:0 5px;margin-left:4px}
.card{padding:10px 12px;background:var(--row);border-top:4px solid var(--line)}
.card.first{background:var(--panel);color:var(--ink);border-top-color:var(--gold);clip-path:polygon(0 0,100% 0,100% 82%,88% 100%,0 100%)}
.card .big{font-family:var(--mono);font-size:32px;margin:0;line-height:1.1}
.bar{height:6px;background:#34373C}.bar>div{height:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel);color:var(--ink);padding:8px 16px;z-index:9;border-top:3px solid var(--orange);font-size:14px}
.banner{background:#3a3220;border-left:3px solid var(--gold);color:#F2E2B4;padding:6px 10px;font-size:12px;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;color:#C4C7CC;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
.list{display:flex;flex-direction:column;gap:4px}
.you{font-size:10px;background:var(--blue);color:#fff;padding:0 4px;margin-left:6px;vertical-align:2px}
.spin{display:inline-block;animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.flash{animation:fl .12s linear}
.rsel.first{border-color:var(--gold);color:var(--gold)}
table.imp td{padding:3px 4px}@keyframes fl{from{opacity:.4}to{opacity:1}}
</style>
</head>
<body>
<svg class="bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <polygon points="200,0 380,0 100,800 -80,800" fill="#fff" fill-opacity=".045"/>
  <polygon points="420,0 480,0 200,800 140,800" fill="#fff" fill-opacity=".035"/>
  <polygon points="980,0 1060,0 820,800 740,800" fill="#fff" fill-opacity=".025"/>
  <g stroke="#3E4146" stroke-width="1.2" fill="none">
    <path d="M0 640 L120 640 L120 500 L260 500 L260 640 L380 640"/>
    <path d="M50 500 L50 360 L190 360 L190 500"/><path d="M100 360 L120 270 L140 360"/>
    <line x1="0" y1="690" x2="420" y2="690"/>
    <path d="M900 800 L900 620 L1040 620 L1040 540 L1200 540"/>
  </g>
  <g stroke="#5A5D63" stroke-width="1"><circle cx="330" cy="130" r="9" fill="none"/><line x1="330" y1="110" x2="330" y2="150"/><line x1="310" y1="130" x2="350" y2="130"/></g>
</svg>
<div id="app"><p class="muted" style="padding:40px 0">接続中…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
/* =====================================================
   設定：Firebaseの設定をここに貼り付けます。
   空のままだと「お試しモード」（この端末のブラウザだけに保存）で動きます。
   ===================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCR-RL-mwSVuTFxkV4Us8zh0eKksBzjxR0",
  authDomain: "asobiba-304ad.firebaseapp.com",
  databaseURL: "https://asobiba-304ad-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "asobiba-304ad",
  storageBucket: "asobiba-304ad.firebasestorage.app",
  messagingSenderId: "119688179542",
  appId: "1:119688179542:web:f3051e5ec10e3ed3a6f0f7"
};
const ROOT = "gamenight";          // データベース内の保存場所（遊び場と共用しても混ざらないように分ける）
const SITE_NAME = "GAME NIGHT";    // サイト名（仮）

/* ---------------- データ保存（Firebase / お試しモード） ---------------- */
const LOCAL_KEY = "gamenight-local-db";
const PREF_KEY = "gamenight-pref";
const Store = {
  mode: "local", data: null, onChange: () => {},
  async init() {
    if (FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL) {
      const v = "10.12.2";
      const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
      const db = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-database.js`);
      const app = initializeApp(FIREBASE_CONFIG);
      this.db = db; this.ref = db.ref(db.getDatabase(app), ROOT); this.mode = "firebase";
      db.onValue(this.ref, snap => { this.data = snap.val() || {}; this.onChange(); },
        err => { showFatal("データベースに接続できません：" + err.message); });
    } else {
      this.mode = "local";
      this.data = loadLocal();
      window.addEventListener("storage", e => { if (e.key === LOCAL_KEY) { this.data = loadLocal(); this.onChange(); } });
      setTimeout(() => this.onChange(), 0);
    }
  },
  // updates: { "a/b/c": 値 or null(削除) }
  async update(updates) {
    if (this.mode === "firebase") return this.db.update(this.ref, updates);
    const d = structuredClone(this.data);
    for (const [p, v] of Object.entries(updates)) setPath(d, p, v);
    this.data = d; localStorage.setItem(LOCAL_KEY, JSON.stringify(d)); this.onChange();
  }
};
function loadLocal() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch { return {}; } }
function setPath(obj, path, val) {
  const ks = path.split("/"); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== "object" || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
  const last = ks[ks.length - 1];
  if (val === null || val === undefined) delete o[last]; else o[last] = val;
}

/* ---------------- 画面の状態 ---------------- */
const S = {
  view: "access", groupId: null, eventId: null, me: null,
  accessCode: "", accessPick: null, remember: true,
  gnew: null, setup: null, imp: null, draft: null, editRound: null, stTab: "rank",
  viewEventId: null, recMember: null, drawing: null, err: ""
};
const pref = (() => { try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { return {}; } })();
function savePref() { localStorage.setItem(PREF_KEY, JSON.stringify(pref)); }

/* ---------------- 便利関数 ---------------- */
const D = () => Store.data || {};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, "0");
const now = () => Date.now();
const fmtDate = t => { if (!t) return "-"; const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
const fmtYMD = t => { const d = new Date(t); return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`; };
const fmtDateTime = t => { const d = new Date(t); return `${fmtYMD(t)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const isoDate = t => { const d = new Date(t); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const mname = id => D().members?.[id]?.name ?? "（不明）";
const shortId = id => "ID-" + String(id).slice(-3).toUpperCase();
const grpOf = id => D().groups?.[id];
const grp = () => grpOf(S.groupId);
const evOf = id => D().events?.[id];
const curEv = () => evOf(S.eventId);
const groupMembers = g => Object.entries(g?.members || {}).sort((a, b) => a[1] - b[1]).map(([id]) => id);
const groupGames = g => Object.entries(g?.games || {}).map(([id, x]) => ({ id, ...x })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
const groupEvents = gid => Object.entries(D().events || {}).filter(([, e]) => e.groupId === gid).map(([id, e]) => ({ id, ...e })).sort((a, b) => b.startedAt - a.startedAt);
const playersOf = e => Object.entries(e?.players || {}).sort((a, b) => a[1] - b[1]).map(([id]) => id);
const roundsOf = e => Object.entries(e?.rounds || {}).map(([id, r]) => ({ id, ...r })).sort((a, b) => a.at - b.at);
const gameOf = (e, gameId) => grpOf(e?.groupId)?.games?.[gameId];
const multBadge = m => (m && m > 1) ? `<span class="bdg">×${m}</span>` : "";
const youTag = id => id === S.me ? '<span class="you">YOU</span>' : "";

// 1ゲームの得点：参加人数Nのとき 順位r → (N - r + 1) × 倍率。同じ順位は同じ点。
function roundPoints(r) {
  const ent = Object.entries(r.ranks || {}).filter(([, v]) => v > 0);
  const n = ent.length, m = r.mult || 1, out = {};
  for (const [id, rk] of ent) out[id] = Math.max(0, n - rk + 1) * m;
  return out;
}
function standingsOf(e, rs) {
  const ps = playersOf(e), t = {}; ps.forEach(p => t[p] = 0);
  rs.forEach(r => { const p = roundPoints(r); for (const k in p) if (k in t) t[k] += p[k]; });
  const arr = ps.map(id => ({ id, pts: t[id] })).sort((a, b) => b.pts - a.pts);
  arr.forEach((x, i) => x.rank = (i > 0 && x.pts === arr[i - 1].pts) ? arr[i - 1].rank : i + 1);
  return arr;
}
function withMoves(e) {
  const rs = roundsOf(e), cur = standingsOf(e, rs);
  if (rs.length < 2) return cur.map(x => ({ ...x, move: 0 }));
  const prev = Object.fromEntries(standingsOf(e, rs.slice(0, -1)).map(x => [x.id, x.rank]));
  return cur.map(x => ({ ...x, move: prev[x.id] - x.rank }));
}
function winnersText(e) { const st = standingsOf(e, roundsOf(e)); return st.filter(x => x.rank === 1 && x.pts > 0).map(x => mname(x.id)).join("・"); }
function remainingPool(e) {
  const played = new Set(roundsOf(e).map(r => r.gameId));
  return Object.keys(e?.pool || {}).filter(g => gameOf(e, g) && !played.has(g));
}
function poolSize(e) {
  const pool = Object.keys(e?.pool || {}).filter(g => gameOf(e, g));
  const extra = roundsOf(e).filter(r => !pool.includes(r.gameId)).length;
  return pool.length + extra;
}

/* ---------------- 描画 ---------------- */
const app = document.getElementById("app");
let renderQueued = false;
function render(force) {
  const a = document.activeElement;
  if (!force && a && app.contains(a) && (a.tagName === "INPUT" || a.tagName === "SELECT" || a.tagName === "TEXTAREA") && a.type !== "checkbox") { renderQueued = true; return; }
  renderQueued = false;
  if (!Store.data) return;
  if (D().config?.closed) { app.innerHTML = viewClosed(); return; }
  // グループが消えた／大会が終わった場合の戻り先
  if (S.groupId && !grp()) { S.groupId = null; S.eventId = null; S.view = "access"; }
  const inEventViews = ["menu", "draw", "result", "link"];
  if (S.eventId && (!curEv() || curEv().status === "done")) { S.eventId = null; if (inEventViews.includes(S.view) || (S.view === "standings" && !S.viewEventId)) S.view = S.groupId ? "hub" : "access"; }
  const v = { access: viewAccess, gnew: viewGroupNew, hub: viewHub, gcfg: viewGroupCfg, games: viewGames, enew: viewEventNew,
    menu: viewMenu, draw: viewDraw, result: viewResult, standings: viewStandings, record: viewRecord, link: viewLink, imp: viewImport }[S.view] || viewAccess;
  app.innerHTML = (Store.mode === "local" ? `<div class="banner">お試しモード：データはこの端末のブラウザだけに保存されます（Firebaseの設定を入れると全員で共有できます）</div>` : "") + v();
  afterRender();
}
document.addEventListener("focusout", () => setTimeout(() => { if (renderQueued) render(); }, 0));

function header(tagText, back) {
  const e = curEv(), g = grp();
  const prog = e && ["menu", "draw", "result", "standings"].includes(S.view) && !S.viewEventId
    ? `<span><span class="pill">GAME</span> <span class="mono" style="color:var(--text);font-size:15px">${pad2(roundsOf(e).length)}/${pad2(poolSize(e))}</span></span>` : "";
  return `<div class="hd"><div class="l">
      ${back ? `<button class="ico" data-act="go" data-v="${back}" aria-label="戻る">←</button>` : ""}
      <span class="tag">${tagText}</span>
      ${g ? `<span class="mono dim">${esc(g.name)} · CODE ${esc(g.code)}</span>` : ""}
    </div><div class="r">
      ${prog}
      <span class="mono dim">SYS.${fmtDateTime(now())}</span>
      ${g ? `<button class="ico" data-act="go" data-v="link" title="別の端末で入る" aria-label="別の端末で入る">▦</button>
             <button class="ico" data-act="logout" title="退室" aria-label="退室">⏻</button>` : ""}
    </div></div>`;
}

/* ----- 入室 ----- */
function viewAccess() {
  const code = S.accessCode.toUpperCase();
  const gid = D().codes?.[code]; const g = gid && grpOf(gid);
  let info = "";
  if (code.length >= 4) {
    if (g) {
      const evs = groupEvents(gid); const act = g.activeEvent && evOf(g.activeEvent);
      info = `<div style="margin-top:12px;border-left:3px solid var(--blue);background:var(--dark);padding:8px 12px">
        <p class="cap" style="margin:0">SQUAD FOUND</p>
        <p style="margin:2px 0 0;font-size:16px">${esc(g.name)}　<span class="muted" style="font-size:13px">メンバー${groupMembers(g).length}人・大会${evs.length}回</span></p>
        <p class="muted" style="margin:0;font-size:13px">${act ? `開催中：${esc(act.title)}（${roundsOf(act).length} / ${poolSize(act)} ゲーム）` : "開催中の大会はありません"}</p></div>`;
    } else info = `<p class="err">このコードのグループは見つかりません</p>`;
  }
  const tiles = g ? groupMembers(g).map(id => `<button class="ptile ${S.accessPick === id ? "on" : ""}" data-act="pick" data-id="${id}">
        <p class="mono capg" style="font-size:10px">${shortId(id)}</p><p class="n">${esc(mname(id))}</p></button>`).join("") : "";
  return `${header("入室 / ACCESS", null)}
  <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)">
    <div>
      <div class="stripe"></div>
      <p class="cap" style="margin-top:12px">STEP 1　GROUP CODE</p>
      <div class="wp top-o cut" style="padding:10px 14px">
        <input id="codeInput" class="mono" maxlength="6" autocomplete="off" placeholder="K7QD" value="${esc(code)}"
          style="width:100%;border:0;background:transparent;font-size:32px;letter-spacing:8px;outline:none;color:var(--ink);text-transform:uppercase">
      </div>
      ${info}
      <div style="margin-top:22px">
        <p class="cap">NEW SQUAD</p>
        <button class="btn2" data-act="newGroup">＋ 新しいグループを作る</button>
      </div>
    </div>
    <div>
      <p class="cap">STEP 2　SELECT PLAYER</p>
      ${g ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${tiles}</div>
        <label class="chk" style="margin-top:12px"><input type="checkbox" data-chg="remember" ${S.remember ? "checked" : ""}> この端末で次回から自動で入室する</label>
        <div style="margin-top:12px"><button class="btn" data-act="enter">入室 / ENTER</button></div>
        <p class="err">${esc(S.err)}</p>`
      : `<div class="row" style="color:var(--sub)">グループのコードを入れると、メンバーの名前が表示されます</div>`}
    </div>
  </div>`;
}

/* ----- グループを作る ----- */
function viewGroupNew() {
  const st = S.gnew;
  return `${header("新しいグループ / NEW SQUAD", "access")}
  <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <div>
      <p class="cap">SQUAD NAME</p>
      <input class="field" data-inp="gnew.name" value="${esc(st.name)}" placeholder="いつもの4人">
      <p class="cap" style="margin-top:16px">MEMBERS</p>
      <div class="list">
        ${st.members.map((n, i) => `<div class="row" style="padding:6px 10px"><span>${esc(n)}</span><button class="btn2" style="padding:2px 8px;font-size:12px" data-act="gnewDel" data-i="${i}">外す</button></div>`).join("") || `<p class="muted" style="font-size:13px">メンバーを追加してください（2人以上）</p>`}
      </div>
      <div style="display:flex;gap:6px;margin-top:8px"><input class="field" id="gnewMember" placeholder="名前（例：たろう）"><button class="btn2" data-act="gnewAdd">追加</button></div>
    </div>
    <div>
      <p class="cap">GAME LIST</p>
      <label class="chk row" style="padding:10px 12px"><input type="checkbox" data-chg="gnewSeed" ${st.seed ? "checked" : ""}> 前回のExcelの17ゲーム（自由枠・倍率込み）を候補に入れる</label>
      <p class="muted" style="font-size:12px">あとから「ゲーム候補」で追加・削除・倍率の変更ができます。</p>
    </div>
  </div>
  <div style="margin-top:18px"><button class="btn gold" data-act="createGroup">グループを作成してコードを発行</button><p class="err">${esc(S.err)}</p></div>`;
}

/* ----- グループのホーム ----- */
function viewHub() {
  const g = grp(); const evs = groupEvents(S.groupId); const act = g.activeEvent && evOf(g.activeEvent);
  const done = evs.filter(e => e.status === "done");
  const rec = recordStats(S.groupId).order.slice(0, 6);
  let actHtml;
  if (act && act.status !== "done") {
    const st = standingsOf(act, roundsOf(act)); const lead = st.filter(x => x.rank === 1);
    actHtml = `<div style="background:var(--dark);border-left:3px solid var(--blue);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <div><p style="margin:0;font-size:17px">${esc(act.title)}</p><p class="muted" style="margin:0;font-size:13px">${roundsOf(act).length} / ${poolSize(act)} ゲーム　首位 ${lead.map(x => esc(mname(x.id))).join("・")} ${lead[0]?.pts ?? 0}pt</p></div>
      <button class="btn" data-act="openActive">続きから</button></div>`;
  } else {
    actHtml = `<div style="background:var(--dark);border-left:3px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="muted">開催中の大会はありません</span><button class="btn" data-act="newEvent">＋ 新しい大会</button></div>`;
  }
  return `${header("グループ / SQUAD", null)}
  <div class="grid2" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)">
    <div>
      <div class="stripe"></div>
      <p class="mono dim" style="margin:8px 0 0;font-size:11px">SQUAD / ${esc(g.code)}</p>
      <p style="font-size:24px;font-weight:600;margin:0 0 12px">${esc(g.name)}</p>
      <p class="cap">ACTIVE EVENT</p>
      ${actHtml}
      <p class="cap" style="margin-top:16px">ARCHIVE（このグループの過去の大会）</p>
      <div class="list">
        ${done.map(e => `<button class="row rowcut" style="text-align:left;padding:8px 12px" data-act="openEvent" data-id="${e.id}">
          <span><span class="mono dim" style="font-size:12px">${fmtYMD(e.startedAt)}</span>　${esc(e.title)}${e.imported ? ' <span style="font-size:10px;background:#4A4D53;padding:0 4px">Excelから登録</span>' : ""}</span>
          <span style="color:var(--gold);font-size:13px;margin-right:10px">優勝 ${esc(winnersText(e) || "-")}</span></button>`).join("") || `<p class="muted" style="font-size:13px">まだ終了した大会はありません</p>`}
      </div>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
        <button class="btn2" data-act="newImport">過去の大会を登録</button>
      </div>
    </div>
    <div>
      <p class="cap">SQUAD RECORD（このグループの通算）</p>
      <div class="list">
        ${rec.map((x, i) => `<div class="${i === 0 && x.win > 0 ? "wp" : "row"}" style="display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:7px 10px;${i === 0 && x.win > 0 ? "border-left:4px solid var(--gold)" : ""}">
          <span>${esc(mname(x.id))}${youTag(x.id)}${g.members?.[x.id] === undefined ? '<span class="dim" style="font-size:11px">（外れた）</span>' : ""}</span><span class="mono">優勝 ${x.win}</span><span class="mono">平均 ${x.ev ? Math.round(x.sum / x.ev) : "-"}</span></div>`).join("") || `<p class="muted" style="font-size:13px">終了した大会がまだありません</p>`}
      </div>
      <button class="btn2" style="margin-top:8px" data-act="go" data-v="record">通算成績・得意不得意を見る</button>
      <div class="tiles" style="margin-top:16px">
        <button class="tile wp span3 top-o" data-act="go" data-v="games"><div><p class="t" style="font-size:19px">ゲーム候補</p><p class="capg">GAMES</p></div></button>
        <button class="tile span3" style="background:var(--bg2);border:1px solid var(--line)" data-act="go" data-v="gcfg"><div><p class="t" style="font-size:19px">グループ設定</p><p class="capg">CONFIG</p></div></button>
      </div>
    </div>
  </div>`;
}

    <div>
      <div class="stripe"></div>
      <p class="cap" style="margin-top:10px">SQUAD NAME</p>
      <input class="field" value="${esc(g.name)}" data-chg="groupName">
      <p class="cap" style="margin-top:14px">GROUP CODE（固定）</p>
      <div class="wp top-o mono" style="padding:8px 12px;font-size:28px;letter-spacing:6px">${esc(g.code)}</div>
      <p class="muted" style="font-size:12px;margin-top:6px">このコードとリンクは大会が変わっても同じです。</p>

/* ----- ゲーム候補（グループごと） ----- */
function viewGames() {
  const g = grp(); const e = curEv(); const played = new Set(roundsOf(e).map(r => r.gameId));
  return `${header("ゲーム候補 / GAMES", e ? "menu" : "hub")}
  <p class="cap">GAME LIST${e ? "（チェック＝今の大会の抽選に入れる）" : ""}</p>
  <div class="list">
  ${groupGames(g).map(x => `<div class="row" style="padding:6px 10px;flex-wrap:wrap">
    <span style="display:flex;align-items:center;gap:8px">${e ? `<input type="checkbox" style="width:18px;height:18px;accent-color:var(--blue)" data-chg="poolToggle" data-id="${x.id}" ${e.pool?.[x.id] ? "checked" : ""} ${played.has(x.id) ? "disabled" : ""}>` : ""}
      ${esc(x.name)}${x.isFree ? '<span class="dim" style="font-size:12px">（自由枠）</span>' : ""}${played.has(x.id) ? '<span class="dim" style="font-size:12px">（済）</span>' : ""}</span>
    <span style="display:flex;gap:6px;align-items:center">
      <select class="field" style="width:auto;padding:4px 6px" data-chg="mult" data-id="${x.id}">${[1, 2, 3].map(m => `<option value="${m}" ${(x.mult || 1) === m ? "selected" : ""}>×${m}</option>`).join("")}</select>
      <button class="btn2" style="padding:4px 8px;font-size:12px" data-act="delGame" data-id="${x.id}">削除</button></span></div>`).join("") || `<p class="muted">まだゲームがありません</p>`}
  </div>
  <p class="cap" style="margin-top:14px">ADD GAME</p>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <input class="field" id="gName" placeholder="ゲーム名（例：ニムト）" style="flex:1;min-width:160px">
    <select class="field" id="gMult" style="width:auto"><option value="1">×1</option><option value="2">×2</option><option value="3">×3</option></select>
    <label class="chk"><input type="checkbox" id="gFree">自由枠</label>
    <button class="btn2" data-act="addGame">追加</button></div>
  <p class="err">${esc(S.err)}</p>`;
}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        ${groupMembers(g).map(id => `<button class="ptile ${st.players.includes(id) ? "on" : ""}" data-act="setupPlayer" data-id="${id}"><p class="n" style="font-size:16px">${esc(mname(id))}</p></button>`).join("")}

/* ----- メニュー ----- */
function viewMenu() {
  const e = curEv(); const st = withMoves(e); const rs = roundsOf(e); const last = rs[rs.length - 1];
  const leaders = st.filter(x => x.rank === 1);
  const total = poolSize(e) || 1; const ratio = Math.min(1, rs.length / total);
  const circ = 2 * Math.PI * 36; const second = st.find(x => x.rank > 1); const cur = e.current;
  let latest = "まだ結果がありません";
  if (last) { const p = roundPoints(last); const best = Math.max(...Object.values(p)); const w = Object.keys(p).filter(k => p[k] === best).map(mname).join("・"); latest = `${esc(last.name)}　${esc(w)}が1位`; }
  return `${header(`<span class="mono">${esc(SITE_NAME)}</span>`, "hub")}
  <div class="grid2">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="stripe"></div>
      <div style="display:flex;align-items:center;gap:14px">
        <svg width="92" height="92" viewBox="0 0 86 86" aria-hidden="true"><circle cx="43" cy="43" r="36" stroke="#3A3D42" stroke-width="6" fill="none"/>
          <circle cx="43" cy="43" r="36" stroke="#F2C14E" stroke-width="6" fill="none" stroke-dasharray="${(circ * ratio).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 43 43)"/>
          <text x="43" y="49" text-anchor="middle" font-size="30" fill="#EDEDED">1</text><text x="43" y="64" text-anchor="middle" font-size="9" fill="#A9ADB4">RANK</text></svg>
        <div>
          <p class="mono dim" style="margin:0;font-size:11px">${esc(e.title)} / LEADER</p>
          <p style="font-size:21px;font-weight:600;margin:0">${leaders.map(x => esc(mname(x.id)) + youTag(x.id)).join("・")}</p>
          <p class="muted" style="margin:0"><span class="mono" style="color:var(--text);font-size:18px">${leaders[0]?.pts ?? 0}</span> pt${second ? `　｜　2位と ${leaders[0].pts - second.pts} 点差` : ""}</p>
        </div>
      </div>
      <div style="background:var(--dark);border-left:3px solid var(--blue);padding:8px 12px"><p class="cap" style="margin:0">LATEST REPORT</p><p style="margin:2px 0 0">${latest}</p></div>
      <div class="list">
        ${st.filter(x => x.rank > 1).map(x => `<div class="row rowcut"><span><span class="mono dim">${pad2(x.rank)}</span>　${esc(mname(x.id))}${youTag(x.id)}</span><span class="mono" style="margin-right:12px">${x.pts}</span></div>`).join("")}
      </div>
    </div>
    <div class="tiles">
      <button class="span6 wp cut top-o" data-act="go" data-v="draw" style="text-align:left;padding:14px 18px;display:flex;justify-content:space-between;align-items:center">
        <div><p class="capg">NEXT OPERATION</p>
          <p style="font-size:26px;font-weight:600;margin:0">${cur ? (cur.name ? esc(cur.name) : "自由枠（ゲーム選択待ち）") : "未抽選"}</p>
          ${cur ? `<span style="background:var(--ink);color:var(--panel);font-size:12px;padding:1px 8px">倍率 ×${cur.mult || 1}</span>` : `<span class="dim" style="font-size:13px">タップして抽選</span>`}</div>
        <div style="text-align:right"><p class="mono" style="font-size:44px;margin:0;line-height:1">${pad2(rs.length + 1)}</p><p class="dim" style="font-size:12px;margin:0">/ ${pad2(total)}</p></div>
      </button>
      <button class="tile wp span3" data-act="go" data-v="draw"><div><p class="t">抽選</p><p class="capg">DRAW</p></div><span style="font-size:26px;color:#C9CACC">⚄</span></button>
      <button class="tile wp span3" data-act="openResult"><div><p class="t">結果入力</p><p class="capg">RESULT</p></div><span style="font-size:26px;color:#C9CACC">✎</span></button>
      <button class="span6" data-act="go" data-v="standings" style="display:grid;grid-template-columns:1fr 1.5fr;text-align:left">
        <div style="background:var(--blue);color:#fff;padding:14px;clip-path:polygon(0 0,100% 0,100% 100%,6% 100%,0 80%)"><span style="font-size:24px;font-weight:600">集計</span></div>
        <div style="display:flex;flex-direction:column">
          <div style="background:var(--bg2);font-size:12px;padding:3px 10px;letter-spacing:2px">STANDINGS</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;flex:1">
            <div style="background:var(--blue2);color:#fff;padding:8px 10px;font-size:16px;border-right:1px solid var(--blue)">今日の順位</div>
            <div style="background:var(--blue2);color:#fff;padding:8px 10px;font-size:16px">ゲーム別</div></div></div>
      </button>
      <button class="tile wp span2 top-o" data-act="go" data-v="games"><div><p class="t" style="font-size:20px">候補</p><p class="capg">GAMES</p></div></button>
      <button class="tile wp span2" data-act="go" data-v="hub"><div><p class="t" style="font-size:20px">記録</p><p class="capg">ARCHIVE</p></div></button>
      <button class="tile span2" data-act="go" data-v="record" style="background:var(--bg2);border:1px solid var(--line)"><div><p class="t" style="font-size:20px">通算</p><p class="capg">RECORD</p></div></button>
    </div>
  </div>`;
}

/* ----- 抽選 ----- */
function viewDraw() {
  const e = curEv(); const cur = e.current; const rem = remainingPool(e);
  const played = new Set(roundsOf(e).map(r => r.gameId));
  const shown = S.drawing ? { name: S.drawing } : cur;
  let free = "";
  if (cur && cur.isFree && !cur.name && !S.drawing) {
    const st = standingsOf(e, roundsOf(e)); const lastRank = Math.max(...st.map(x => x.rank));
    const choosers = st.filter(x => x.rank === lastRank).map(x => mname(x.id)).join("・");
    free = `<div style="margin-top:12px;background:var(--dark);border-left:3px solid var(--red);padding:10px 12px">
      <p class="cap" style="color:#F27C7C;margin:0">FREE SLOT</p>
      <p style="margin:2px 0 8px">選ぶ人：<b>${esc(choosers)}</b>（現在最下位）</p>
      <div style="display:flex;gap:6px"><input class="field" id="freeName" placeholder="遊ぶゲーム名を入力"><button class="btn2" data-act="setFree">決定</button></div></div>`;
  }
  const poolGames = groupGames(grp()).filter(x => e.pool?.[x.id]);
  return `${header("抽選 / DRAW", "menu")}
  <div class="grid2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)">
    <div>
      <div class="stripe"></div>
      <div class="wp cut top-o ${S.drawing ? "flash" : ""}" style="margin-top:8px;padding:18px 18px 16px">
        <p class="capg">${S.drawing ? "SCANNING…" : cur ? "TARGET LOCKED" : "STANDBY"}</p>
        <p style="font-size:32px;font-weight:600;margin:4px 0">${shown ? (shown.name ? esc(shown.name) : "自由枠") : "―"}</p>
        ${cur && !S.drawing ? `<span style="background:var(--ink);color:var(--panel);font-size:12px;padding:2px 8px">倍率 ×${cur.mult || 1}</span>` : ""}
      </div>
      ${free}
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        ${!cur ? `<button class="btn" data-act="draw">⚄ 抽選する</button>`
          : `<button class="btn" data-act="openResult">✓ このゲームで開始 → 結果入力</button><button class="btn2" data-act="draw">↻ 引き直す</button><button class="btn2" data-act="clearCur">取り消す</button>`}
      </div>
      <p class="muted" style="font-size:12px;margin-top:8px">残り ${rem.length} ゲームからランダムに選びます（同じゲームは出ません）</p>
      <p class="err">${esc(S.err)}</p>
    </div>
    <div>
      <p class="cap">CANDIDATE LIST</p>
      <div class="list" style="font-size:14px">
        ${poolGames.map(x => {
          const isCur = cur && cur.gameId === x.id, done = played.has(x.id);
          return `<div class="row" style="${isCur ? "background:var(--panel);color:var(--ink);border-left:3px solid var(--orange)" : done ? "background:transparent;color:var(--dim);text-decoration:line-through" : ""};padding:5px 10px">
            <span>${esc(x.name)}${done ? "（済）" : ""}</span><span>${x.mult > 1 ? `<span style="color:${isCur ? "var(--red)" : "#F27C7C"}">×${x.mult}</span>` : ""}</span></div>`;
        }).join("") || `<p class="muted">抽選に入っているゲームがありません。「候補」で追加してください</p>`}
      </div>
    </div>
  </div>`;
}

/* ----- 結果入力 ----- */
function viewResult() {
  const e = evOf(S.editRound ? S.editEvent : S.eventId); if (!e) return `${header("結果入力 / RESULT", "hub")}<p>大会が見つかりません</p>`;
  const ps = playersOf(e);
  const target = S.editRound ? e.rounds?.[S.editRound] : e.current;
  if (!target || !target.name) {
    return `${header("結果入力 / RESULT", "menu")}<div class="row">先に「抽選」で次のゲームを決めてください${target && target.isFree ? "（自由枠のゲーム名が未入力です）" : ""}</div>
      <div style="margin-top:12px"><button class="btn" data-act="go" data-v="draw">抽選へ</button></div>`;
  }
  const n = ps.length; const dr = S.draft || {};
  const parts = Object.values(dr).filter(v => v > 0).length;
  const prev = roundPoints({ ranks: Object.fromEntries(Object.entries(dr).filter(([, v]) => v > 0)), mult: target.mult });
  return `${header(S.editRound ? "結果の修正 / EDIT" : "結果入力 / RESULT", S.editRound ? "backEdit" : "menu")}
  <p class="mono dim" style="margin:-6px 0 12px">OP ${esc(target.name)} ×${target.mult || 1}</p>
  <div class="grid2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)">
    <div class="list" style="gap:6px">
      ${ps.map(id => `<div class="row rowcut" style="flex-wrap:wrap"><span><span class="mono dim" style="font-size:11px">${shortId(id)}</span>　${esc(mname(id))}${youTag(id)}</span>
        <span style="display:flex;gap:4px;margin-right:10px">${Array.from({ length: n }, (_, i) => `<button class="rk ${dr[id] === i + 1 ? "on" : ""}" data-act="rank" data-id="${id}" data-r="${i + 1}">${i + 1}</button>`).join("")}
        <button class="rk x ${dr[id] === 0 ? "on" : ""}" data-act="rank" data-id="${id}" data-r="0">不参加</button></span></div>`).join("")}
      <p class="muted" style="font-size:12px;margin:4px 0 0">同じ順位は重ねて選べます。抜けた人は「不参加」にすると、残りの人数で点数を計算します。</p>
    </div>
    <div>
      <div class="wp top-o" style="padding:12px 14px">
        <p class="capg">SCORE PREVIEW（${parts}人参加）</p>
        <div class="mono" style="font-size:15px;line-height:1.9;margin-top:4px">
          ${ps.filter(id => dr[id] > 0).sort((a, b) => prev[b] - prev[a]).map(id => `<div>${esc(mname(id))}<span style="float:right">+${prev[id]}</span></div>`).join("") || `<span style="color:#8A8D93">順位を選ぶと表示されます</span>`}
        </div>
      </div>
      <button class="btn" data-act="submitResult" style="margin-top:10px;width:100%;justify-content:center">${S.editRound ? "修正を保存" : "確定 / SUBMIT"}</button>
      ${S.editRound ? `<button class="btn2 danger" data-act="deleteRound" style="margin-top:8px;width:100%;justify-content:center">この結果を削除</button>` : ""}
      <p class="err">${esc(S.err)}</p>
    </div>
  </div>`;
}

/* ----- 集計（開催中・過去） ----- */
function viewStandings() {
  const id = S.viewEventId || S.eventId; const e = evOf(id);
  if (!e) return `${header("集計 / STANDINGS", "hub")}<p>大会が見つかりません</p>`;
  const ro = !!S.viewEventId;
  const st = withMoves(e); const rs = roundsOf(e); const ps = playersOf(e);
  const tabs = `<span style="display:flex;gap:6px">
     <button class="${S.stTab === "rank" ? "wp" : "btn2"}" style="padding:3px 12px" data-act="stTab" data-t="rank">${ro ? "最終順位" : "今日の順位"}</button>

/* ----- 通算（グループ内） ----- */
function rankLetter(v) { return v >= .8 ? "S" : v >= .6 ? "A" : v >= .4 ? "B" : v >= .2 ? "C" : "D"; }
function recordStats(gid) {
  const g = grpOf(gid); const stat = {};
  const ensure = id => stat[id] ||= { id, ev: 0, win: 0, sum: 0, games: {} };
  groupMembers(g).forEach(ensure);
  for (const e of groupEvents(gid)) {
    const rs = roundsOf(e);
    if (e.status === "done") for (const x of standingsOf(e, rs)) { const s = ensure(x.id); s.ev++; s.sum += x.pts; if (x.rank === 1 && x.pts > 0) s.win++; }
    for (const r of rs) {
      const ent = Object.entries(r.ranks || {}).filter(([, v]) => v > 0); const n = ent.length; if (n < 2) continue;
      for (const [id, rk] of ent) { const gm = ensure(id).games[r.name] ||= { n: 0, s: 0 }; gm.n++; gm.s += (n - rk) / (n - 1); }
    }
  }
  const avg = s => s.ev ? s.sum / s.ev : 0;
  const order = Object.values(stat).sort((a, b) => b.win - a.win || avg(b) - avg(a));
  return { stat, order, done: groupEvents(gid).filter(e => e.status === "done").length };
}
function viewRecord() {
  const { stat, order, done } = recordStats(S.groupId); const g = grp(); const inG = new Set(groupMembers(g));
  const sel = S.recMember && stat[S.recMember] ? S.recMember : (S.me && stat[S.me] ? S.me : order[0]?.id);
  const apt = sel ? Object.entries(stat[sel].games).map(([name, x]) => ({ name, n: x.n, v: x.s / x.n })).sort((a, b) => b.v - a.v) : [];
  const col = v => v >= .8 ? "var(--gold)" : v >= .4 ? "var(--blue)" : "var(--red)";
  return `${header("通算 / RECORD", S.eventId ? "menu" : "hub")}
  <p class="mono dim" style="margin:-6px 0 12px">${esc(g.name)}　TOTAL ${done} EVENTS（このグループの終了した大会のみ集計）</p>
  <div class="grid2" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)">
    <div>
      <p class="cap">PLAYER STATUS（タップで得意・不得意を表示）</p>
      <div class="list">
        ${order.map(s => { const on = s.id === sel;
          return `<button class="${on ? "wp" : "row"}" data-act="recSel" data-id="${s.id}" style="display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:8px 12px;text-align:left;${on ? "border-left:4px solid var(--gold)" : ""}">
            <span>${esc(mname(s.id))}${youTag(s.id)}${inG.has(s.id) ? "" : '<span class="dim" style="font-size:11px">（外れたメンバー）</span>'}</span><span class="mono">参加 ${s.ev}</span><span class="mono">優勝 ${s.win}</span><span class="mono">平均 ${s.ev ? Math.round(s.sum / s.ev) : "-"}</span></button>`; }).join("") || `<p class="muted">メンバーがいません</p>`}
      </div>
    </div>
    <div>
      <p class="cap">${esc(sel ? mname(sel) : "")} / GAME APTITUDE</p>
      <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">
        ${apt.map(a => `<div><div style="display:flex;justify-content:space-between"><span>${esc(a.name)} <span class="dim" style="font-size:11px">${a.n}回</span></span><span class="mono" style="color:${col(a.v)}">${rankLetter(a.v)}</span></div>
          <div class="bar"><div style="width:${Math.max(4, Math.round(a.v * 100))}%;background:${col(a.v)}"></div></div></div>`).join("") || `<p class="muted">まだデータがありません</p>`}
      </div>
      <p class="muted" style="font-size:11px;margin-top:10px">ランクは平均順位で決めます（1位=100%、最下位=0%の平均。S 80%以上／A 60%／B 40%／C 20%／D それ未満）</p>
    </div>

}

function normName(s) { return String(s).replace(/^[①-⑳⓪\s]+/, "").replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim(); }
const nameKey = s => String(s).normalize("NFKC").replace(/\s+/g, "").toLowerCase();
function parseImport(text, n) {
  const rows = [];
  const toNum = c => { const t = String(c ?? "").trim().replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)); return t === "" ? null : (/^-?\d+(\.\d+)?$/.test(t) ? Number(t) : NaN); };
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    let name, cells;
    if (line.includes("\t")) { const c = line.split("\t"); name = c[0]; cells = c.slice(1); }
    else { const t = line.trim().split(/\s+/); const i = t.findIndex(x => toNum(x) !== null && !isNaN(toNum(x))); if (i <= 0) continue; name = t.slice(0, i).join(" "); cells = t.slice(i); }
    name = normName(name);
    if (!name || /合計/.test(name)) continue;
    const vals = Array.from({ length: n }, (_, i) => toNum(cells[i]));
    if (vals.some(v => Number.isNaN(v)) || vals.every(v => v === null)) continue; // 見出し行など
    const present = vals.filter(v => v !== null); const m = present.length;
    const sum = present.reduce((a, b) => a + b, 0); const base = m * (m + 1) / 2;
    let k = Math.max(1, Math.round(sum / base)); if (k > 3 || !present.every(v => v % k === 0)) k = 1;
    const ranks = {}; const rk = vals.map(v => v === null ? 0 : v / k);
    let warn = "";
    rk.forEach(r => { if (r !== 0 && (r < 1 || r > m || !Number.isInteger(r))) warn = `順位として読めない数字があります（${vals.join("・")}）。直してください`; });
    if (m < 2) warn = "参加者が2人未満です";
    const isFree = /自由枠/.test(name);
    rows.push({ name: isFree ? "自由枠" : name, mult: k, rk, warn, note: isFree ? "自由枠：実際に遊んだゲーム名に書き換えできます" : k > 1 ? `${k}倍を検出（${vals.join("・")} → 順位に変換）` : "" });
  }
  return rows;
}

  /* 大会 */
  newEvent: () => { const g = grp(); const n = groupEvents(S.groupId).length + 1;
    S.setup = { title: `第${n}回大会`, players: groupMembers(g), games: groupGames(g).map(x => x.id) }; go("enew"); },
  setupPlayer: d => { const p = S.setup.players; const i = p.indexOf(d.id); if (i >= 0) p.splice(i, 1); else p.push(d.id); S.err = ""; render(true); },
  createEvent: async () => {
    const st = S.setup; const g = grp();
    if (g.activeEvent && evOf(g.activeEvent)?.status !== "done") { S.err = "開催中の大会があります。先に終了してください"; return render(true); }
    const order = groupMembers(g).filter(id => st.players.includes(id));
    if (order.length < 2 || order.length > 6) { S.err = "参加者を2〜6人にしてください"; return render(true); }
    if (!st.games.length) { S.err = "抽選に入れるゲームを1つ以上選んでください"; return render(true); }
    const id = uid(), t = now();
    await Store.update({
      [`events/${id}`]: { groupId: S.groupId, title: st.title.trim() || "大会", status: "active", startedAt: t, updatedAt: t,
        players: Object.fromEntries(order.map((p, i) => [p, i])), pool: Object.fromEntries(st.games.map(x => [x, true])) },
      [`groups/${S.groupId}/activeEvent`]: id
    });
    S.eventId = id; toast("大会を開始しました"); go("menu");
  },
  openActive: () => { const g = grp(); S.eventId = g.activeEvent; go("menu"); },
  draw: () => {
    const e = curEv(); let rem = remainingPool(e);
    if (e.current && rem.length > 1) rem = rem.filter(x => x !== e.current.gameId);
    if (!rem.length) { S.err = "残りのゲームがありません（「候補」で追加できます）"; return render(true); }
    const pick = rem[Math.floor(Math.random() * rem.length)];
    const names = rem.map(x => gameOf(e, x)?.name || "?"); let k = 0; S.err = "";
    const timer = setInterval(() => { S.drawing = names[k++ % names.length]; render(true); }, 90);
    setTimeout(async () => {
      clearInterval(timer); S.drawing = null; const x = gameOf(e, pick);
      await Store.update({ [`events/${S.eventId}/current`]: { gameId: pick, name: x.isFree ? "" : x.name, mult: x.mult || 1, isFree: !!x.isFree, at: now() }, ...touch() });
      render(true);
    }, 1300);
  },
  clearCur: async () => { await Store.update({ [`events/${S.eventId}/current`]: null, ...touch() }); },
  setFree: async () => { const v = document.getElementById("freeName").value.trim(); if (!v) { S.err = "ゲーム名を入力してください"; return render(true); }
    S.err = ""; await Store.update({ [`events/${S.eventId}/current/name`]: v, ...touch() }); render(true); },
  openResult: () => { S.editRound = null; S.draft = {}; go("result"); },
  editRound: d => {
    const eid = S.viewEventId || S.eventId; const r = evOf(eid)?.rounds?.[d.id]; if (!r) return;
    S.editEvent = eid; S.editRound = d.id; S.draft = { ...(r.ranks || {}) };
    if (S.viewEventId) { S.eventId = null; }
    S.view = "result"; S.err = ""; render(true);
  },
  rank: d => { S.draft = S.draft || {}; const r = Number(d.r); if (S.draft[d.id] === r) delete S.draft[d.id]; else S.draft[d.id] = r; S.err = ""; render(true); },
  submitResult: async () => {
    const eid = S.editRound ? S.editEvent : S.eventId; const e = evOf(eid); const ps = playersOf(e); const dr = S.draft || {};
    const missing = ps.filter(p => !(p in dr)); if (missing.length) { S.err = `${missing.map(mname).join("・")} の順位が未選択です`; return render(true); }
    const n = ps.filter(p => dr[p] > 0).length; if (n < 2) { S.err = "参加者が2人以上必要です"; return render(true); }
    const over = ps.filter(p => dr[p] > n); if (over.length) { S.err = `参加は${n}人なので、順位は1〜${n}で選んでください`; return render(true); }
    const ranks = Object.fromEntries(ps.map(p => [p, dr[p]]));
    if (S.editRound) {
      await Store.update({ [`events/${eid}/rounds/${S.editRound}/ranks`]: ranks, [`events/${eid}/updatedAt`]: now() });
      toast("結果を修正しました"); const back = e.status === "done"; S.editRound = null; S.draft = null;
      if (back) { S.viewEventId = eid; S.view = "standings"; S.err = ""; return render(true); }
      return go("standings");
    }
    const c = e.current; const rid = uid();
    await Store.update({ [`events/${eid}/rounds/${rid}`]: { gameId: c.gameId, name: c.name, mult: c.mult || 1, ranks, at: now(), by: S.me || "" },
      [`events/${eid}/current`]: null, ...touch() });
    S.draft = null; toast("結果を確定しました"); go("menu");
  },
  deleteRound: async () => { if (!confirm("この結果を削除しますか？（元に戻せません）")) return;
    const eid = S.editEvent; const e = evOf(eid); const r = e.rounds?.[S.editRound];
    await Store.update({ [`events/${eid}/rounds/${S.editRound}`]: null, [`events/${eid}/updatedAt`]: now() });
    toast(`${r?.name ?? ""} の結果を削除しました`); S.editRound = null; S.draft = null;
    if (e.status === "done") { S.viewEventId = eid; S.view = "standings"; return render(true); }
    go("standings"); },
  stTab: d => { S.stTab = d.t; render(true); },
  finishEvent: async () => { const e = curEv(); if (!confirm(`「${e.title}」を終了しますか？\n結果はグループの「記録」と「通算」に残ります。`)) return;
    const eid = S.eventId;
    await Store.update({ [`events/${eid}/status`]: "done", [`events/${eid}/endedAt`]: now(), [`groups/${S.groupId}/activeEvent`]: null, [`events/${eid}/updatedAt`]: now() });
    S.eventId = null; S.viewEventId = eid; S.stTab = "rank"; S.view = "standings"; toast("大会を終了しました"); render(true); },
  openEvent: d => { S.viewEventId = d.id; S.stTab = "rank"; S.view = "standings"; S.err = ""; window.scrollTo(0, 0); render(true); },
  deleteEvent: async () => { const e = evOf(S.viewEventId); if (!confirm(`「${e.title}」を削除しますか？（元に戻せません）`)) return;
    await Store.update({ [`events/${S.viewEventId}`]: null }); toast("大会を削除しました"); go("hub"); },
  recSel: d => { S.recMember = d.id; render(true); },
  copyUrl: async () => { const v = document.getElementById("joinUrl").value; try { await navigator.clipboard.writeText(v); toast("リンクをコピーしました"); } catch { document.getElementById("joinUrl").select(); toast("選択したのでコピーしてください"); } },
  /* 過去の大会の登録 */
  newImport: () => { const g = grp(); S.imp = { title: `第${groupEvents(S.groupId).length + 1}回大会`, date: isoDate(now()), players: groupMembers(g).slice(0, 6), text: "", rows: [] }; go("imp"); },
  impPlayer: d => { const p = S.imp.players; const i = p.indexOf(d.id); if (i >= 0) p.splice(i, 1); else if (p.length < 6) p.push(d.id); S.imp.rows.forEach(r => { for (const k in r.ranks) if (!p.includes(k)) delete r.ranks[k]; }); render(true); },
  impParse: () => {
    const im = S.imp; if (im.players.length < 2) { S.err = "参加者を2人以上選んでください"; return render(true); }
    const rows = parseImport(im.text, im.players.length);
    if (!rows.length) { S.err = "読み取れる行がありませんでした。ゲーム名と数字の範囲をコピーしてください"; return render(true); }
    im.rows = rows.map(r => ({ name: r.name, mult: r.mult, warn: r.warn, note: r.note, ranks: Object.fromEntries(im.players.map((p, i) => [p, r.rk[i]])) }));
    S.err = ""; toast(`${rows.length}行を読み取りました`); render(true);
  },
  impAddRow: () => { const im = S.imp; if (im.players.length < 2) { S.err = "参加者を2人以上選んでください"; return render(true); }
    im.rows.push({ name: "", mult: 1, ranks: Object.fromEntries(im.players.map((p, i) => [p, i + 1])) }); S.err = ""; render(true); },
  impDelRow: d => { S.imp.rows.splice(Number(d.ri), 1); render(true); },
  impSave: async () => {
    const im = S.imp, g = grp(), ps = im.players;
    if (ps.length < 2) { S.err = "参加者を2人以上選んでください"; return render(true); }
    if (!im.rows.length) { S.err = "ゲームの行がありません"; return render(true); }
    for (const [i, r] of im.rows.entries()) {
      if (!r.name.trim()) { S.err = `${i + 1}行目のゲーム名が空です`; return render(true); }
      const vals = ps.map(p => r.ranks[p] || 0); const m = vals.filter(v => v > 0).length;
      if (m < 2) { S.err = `${i + 1}行目（${r.name}）は参加者が2人以上必要です`; return render(true); }
      if (vals.some(v => v > m)) { S.err = `${i + 1}行目（${r.name}）は参加${m}人なので、順位は1〜${m}で選んでください`; return render(true); }
    }
    const start = new Date(im.date + "T12:00:00").getTime() || now();
    const byName = Object.fromEntries(groupGames(g).map(x => [nameKey(x.name), x]));
    const rounds = {};
    im.rows.forEach((r, i) => { const hit = byName[nameKey(r.name)]; rounds[uid() + i] = { gameId: hit?.id || "", name: hit ? hit.name : r.name.trim(), mult: r.mult, ranks: Object.fromEntries(ps.map(p => [p, r.ranks[p] || 0])), at: start + i }; });
    const id = uid();
    await Store.update({ [`events/${id}`]: { groupId: S.groupId, title: im.title.trim() || "過去の大会", status: "done", imported: true, startedAt: start, endedAt: start, updatedAt: now(),
      players: Object.fromEntries(ps.map((p, i) => [p, i])), pool: {}, rounds } });
    toast("過去の大会を登録しました"); S.viewEventId = id; S.stTab = "rank"; S.view = "standings"; render(true);
  }
};
const setByPath = (path, v) => { const [a, b] = path.split("."); S[a][b] = v; };
const changes = {
  remember: el => { S.remember = el.checked; },
  gnewSeed: el => { S.gnew.seed = el.checked; },
  setupGame: el => { const g = S.setup.games; const i = g.indexOf(el.dataset.id); if (el.checked && i < 0) g.push(el.dataset.id); if (!el.checked && i >= 0) g.splice(i, 1); render(true); },
  poolToggle: el => Store.update({ [`events/${S.eventId}/pool/${el.dataset.id}`]: el.checked ? true : null }),
  mult: el => Store.update({ [`groups/${S.groupId}/games/${el.dataset.id}/mult`]: Number(el.value) }),
  groupName: el => { const v = el.value.trim(); if (v) Store.update({ [`groups/${S.groupId}/name`]: v }); },
  renameMember: el => { const v = el.value.trim(); if (v && v !== mname(el.dataset.id)) { Store.update({ [`members/${el.dataset.id}/name`]: v }); toast(`名前を「${v}」に変更しました`); } },
  impMult: el => { S.imp.rows[Number(el.dataset.ri)].mult = Number(el.value); render(true); },
  impRank: el => { const r = S.imp.rows[Number(el.dataset.ri)]; r.ranks[el.dataset.pid] = Number(el.value); r.warn = ""; render(true); }
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el || !app.contains(el)) return;
  if (el.disabled) return; ev.preventDefault(); const f = actions[el.dataset.act]; if (f) f(el.dataset, el);
});
document.addEventListener("change", ev => { const el = ev.target; if (el.dataset?.chg && changes[el.dataset.chg]) changes[el.dataset.chg](el); });
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "codeInput") {
    const v = el.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); const pos = el.selectionStart;
    if (v !== S.accessCode) { S.accessCode = v; S.accessPick = null; S.err = ""; renderQueued = false; render(true); const ni = document.getElementById("codeInput"); ni.focus(); ni.setSelectionRange(pos, pos); }
    return;
  }
  const p = el.dataset?.inp; if (!p) return;
  if (p === "impName") { S.imp.rows[Number(el.dataset.ri)].name = el.value; return; }
  setByPath(p, el.value);
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return; const id = ev.target.id;
  const map = { freeName: "setFree", gName: "addGame", gnewMember: "gnewAdd", cfgMember: "addMember", codeInput: "enter" };
  if (map[id]) { ev.preventDefault(); actions[map[id]](); }
});

/* ---------------- 旧版データの移行（大会ごとのコード → グループ） ---------------- */
async function migrate() {
  const old = Object.entries(D().events || {}).filter(([, e]) => !e.groupId);
  if (!old.length && !D().games) return;
  const u = {}, groups = {}, byKey = {}, taken = {};
  for (const [eid, e] of old) {
    const ps = playersOf(e); const key = [...ps].sort().join(",");
    let gid = byKey[key];
    if (!gid) {
      gid = uid() + Object.keys(byKey).length; byKey[key] = gid; const code = newCode(taken); taken[code] = 1;
      groups[gid] = { name: `グループ${Object.keys(byKey).length}`, code, createdAt: now(), members: Object.fromEntries(ps.map((p, i) => [p, i])), games: D().games || {} };
      u[`codes/${code}`] = gid;
    }
    u[`events/${eid}/groupId`] = gid;
    if (e.status !== "done") { if (groups[gid].activeEvent) u[`events/${eid}/status`] = "done"; else groups[gid].activeEvent = eid; }
    if (e.code) u[`codes/${e.code}`] = null;
  }
  for (const [gid, g] of Object.entries(groups)) u[`groups/${gid}`] = g;
  u["games"] = null;
  await Store.update(u);
}

/* ---------------- 起動 ---------------- */
let booted = false;
Store.onChange = async () => {
  if (!booted) {
    booted = true;
    try { await migrate(); } catch (err) { console.error(err); }
    const q = new URLSearchParams(location.search).get("room");
    if (q) { S.accessCode = q.toUpperCase(); }
    else if (pref.code) {
      const gid = D().codes?.[pref.code]; const g = gid && grpOf(gid);
      if (g && g.members?.[pref.member] !== undefined) { enterGroup(gid, pref.member); return; }
    }
  }
  render();
};
Store.init().catch(err => showFatal("起動に失敗しました：" + err.message));
</script>
