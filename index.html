<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAME NIGHT｜ゲーム大会記録</title>
<style>
:root{
  --bg:#24262A; --bg2:#1E1F22; --panel:#F4F4F2; --ink:#1E1F22; --text:#EDEDED; --sub:#A9ADB4; --dim:#6B6E74;
  --line:#4A4D53; --row:rgba(54,57,62,.92); --dark:rgba(20,21,24,.88);
  --blue:#2E8FD8; --blue2:#4AA3E6; --gold:#F2C14E; --orange:#E06A2C; --red:#C8463C; --green:#5FD49A;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.5}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:14px 14px 40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit}
.mono{font-family:var(--mono)}
.cap{font-size:11px;letter-spacing:2px;color:var(--blue);margin:0 0 6px}
.capg{font-size:11px;letter-spacing:2px;color:#8A8D93;margin:0}
.muted{color:var(--sub)} .dim{color:var(--dim)}
.stripe{height:8px;width:110px;background:repeating-linear-gradient(-45deg,var(--gold) 0 6px,transparent 6px 12px)}
.tag{display:inline-block;background:var(--blue);color:#fff;padding:3px 14px 3px 10px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);font-size:13px;white-space:nowrap}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:14px}
.hd .l,.hd .r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ico{font-size:20px;line-height:1;color:var(--sub);padding:4px}
.ico:hover{color:var(--text)}
.pill{background:var(--blue);color:#fff;padding:1px 6px;font-size:11px}
.wp{background:var(--panel);color:var(--ink)}
.cut{clip-path:polygon(0 0,100% 0,100% 78%,96% 100%,0 100%)}
.top-o{border-top:3px solid var(--orange)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;padding:9px 18px;clip-path:polygon(0 0,100% 0,100% 70%,94% 100%,0 100%);font-size:15px}
.btn:hover{background:var(--blue2)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn2{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);color:#C4C7CC;padding:8px 14px;font-size:14px}
.btn2:hover{border-color:var(--sub);color:var(--text)}
.btn2.danger{border-color:#7a3b36;color:#F27C7C}
.field{width:100%;background:var(--dark);border:1px solid var(--line);color:var(--text);padding:9px 10px;outline:none}
.field:focus{border-color:var(--blue)}
.err{color:#F27C7C;font-size:13px;margin:6px 0 0;min-height:1em}
.grid2{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr);gap:16px}
@media (max-width:760px){.grid2,.linkgrid{grid-template-columns:1fr !important}}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tile{text-align:left;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-end;min-height:72px}
.tile .t{font-size:24px;font-weight:600;margin:0;line-height:1.2}
.tile:hover{filter:brightness(1.06)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span6{grid-column:span 6}
@media (max-width:520px){.span2{grid-column:span 3}.tile .t{font-size:20px}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--row);padding:8px 12px}
.rowcut{clip-path:polygon(0 0,100% 0,97% 100%,0 100%)}
.rk{min-width:36px;text-align:center;padding:4px 0;border:1px solid var(--line);font-family:var(--mono);font-size:15px;color:var(--text)}
.rk.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.rk.x{min-width:56px;font-size:12px;font-family:inherit}
.rk.x.on{background:#555;color:#fff;border-color:#777}
.ptile{text-align:left;padding:10px 12px;background:var(--row);border-left:4px solid transparent;color:var(--text)}
.ptile.on{background:var(--panel);color:var(--ink);border-left-color:var(--gold)}
.ptile .n{font-size:18px;font-weight:600;margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 6px;border-top:1px solid #34373C;text-align:left;font-weight:400}
th{color:#8A8D93;font-size:11px;border-top:0}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(255,255,255,.04)}
.bdg{background:var(--red);color:#fff;font-size:10px;padding:0 5px;margin-left:4px}
.card{padding:10px 12px;background:var(--row);border-top:4px solid var(--line)}
.card.first{background:var(--panel);color:var(--ink);border-top-color:var(--gold);clip-path:polygon(0 0,100% 0,100% 82%,88% 100%,0 100%)}
.card .big{font-family:var(--mono);font-size:32px;margin:0;line-height:1.1}
.bar{height:6px;background:#34373C}.bar>div{height:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel);color:var(--ink);padding:8px 16px;z-index:9;border-top:3px solid var(--orange);font-size:14px}
.banner{background:#3a3220;border-left:3px solid var(--gold);color:#F2E2B4;padding:6px 10px;font-size:12px;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;color:#C4C7CC;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
.list{display:flex;flex-direction:column;gap:4px}
.you{font-size:10px;background:var(--blue);color:#fff;padding:0 4px;margin-left:6px;vertical-align:2px}
.spin{display:inline-block;animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.flash{animation:fl .12s linear}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid;color:#fff;flex-shrink:0;overflow:hidden;font-weight:600;line-height:1;vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover}
.who{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;min-width:0}
.whon{display:inline-flex;flex-direction:column;line-height:1.2;min-width:0}
.hdl{font-family:var(--mono);font-size:10px;color:#8A8D93;font-weight:400}
.wp .hdl{color:#6B6E74}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px}
.wincard{grid-column:span 2;background:var(--gold);color:#2A1E00;padding:12px 14px;clip-path:polygon(0 0,100% 0,100% 82%,94% 100%,0 100%)}
.wincard .you{background:#2A1E00;color:var(--gold)}
@media (max-width:520px){.wincard{grid-column:1/-1}}
.logbox{max-height:max(260px,calc(100vh - 400px));overflow:auto;border:1px solid #34373C}
table.log{border-collapse:separate;border-spacing:0;min-width:100%}
table.log th{position:sticky;top:0;background:var(--bg2);z-index:2;color:var(--text);font-size:13px;padding:8px 8px 6px;white-space:nowrap}
table.log td{padding:7px 8px;white-space:nowrap;border-top:1px solid #34373C;vertical-align:top}
table.log .pts{font-family:var(--mono);font-size:18px}
table.log .pts small{font-size:11px;margin-left:1px}
table.log .cum{font-family:var(--mono);font-size:10px;color:#6B6E74;margin-top:1px}
table.log td.wincell{background:rgba(242,193,78,.12)}
table.log td.wincell .pts{color:var(--gold)}
.yearhd{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--gold);padding-bottom:2px;margin:16px 0 6px}
.yearhd .mono{font-size:30px;color:var(--gold);line-height:1}.yearhd span:last-child{font-size:12px;color:var(--sub)}
.memstrip{display:flex;gap:14px;flex-wrap:wrap;padding:12px 14px;background:var(--dark);border-left:3px solid var(--blue)}
.mem{text-align:center;width:80px}
.mem .av{border-width:3px}
.hub4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:640px){.hub4{grid-template-columns:1fr}}
.h4{min-height:128px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;gap:10px}
.h4:hover{filter:brightness(1.07)}
.h4top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;opacity:.8}
.h4ico{font-size:24px;opacity:.6}
.h4t{display:block;font-size:28px;font-weight:600;line-height:1.2}
.h4s{display:block;font-size:13px;margin-top:2px}
.h4-blue{background:var(--blue);color:#fff;clip-path:polygon(0 0,100% 0,100% 84%,95% 100%,0 100%)}
.h4-light{background:var(--panel);color:var(--ink)}.h4-light .h4s{color:#6B6E74}
.h4-dark{background:var(--bg2);border:1px solid var(--line);color:var(--text)}.h4-dark .h4s{color:var(--sub)}
.h4tag{background:#fff;color:var(--blue);font-size:11px;padding:0 6px;margin-right:6px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.gcard{text-align:left;background:var(--row);padding:10px 12px;color:var(--text);border-top:3px solid transparent}
.gcard:hover{filter:brightness(1.1)}
.gcard.on{background:var(--panel);color:var(--ink);border-top-color:var(--orange);clip-path:polygon(0 0,100% 0,100% 82%,93% 100%,0 100%)}
.gcard.new{border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub);min-height:96px;background:transparent}
.avs{display:flex}.avs .av{margin-right:-6px;border-width:2px}
.ftab{border:1px solid var(--line);color:#C4C7CC;padding:3px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.ftab.on{background:var(--panel);color:var(--ink);border-color:var(--panel)}
.sq{display:inline-block;width:9px;height:9px}
.catpick{border:1px solid var(--cc);color:var(--text);padding:3px 10px;font-size:12px}
.catpick.on{background:var(--cc);color:#fff}.catpick.part{background:color-mix(in srgb,var(--cc) 35%,transparent)}
.cchip{border-left:3px solid var(--cc);background:color-mix(in srgb,var(--cc) 20%,transparent);padding:1px 6px;font-size:12px}
table.master td{padding:4px 5px;vertical-align:middle}
.openlink{display:inline-block;color:#fff;font-size:13px;padding:5px 12px;margin-left:8px;text-decoration:none}
.swap{border:1px solid var(--line);color:#C4C7CC;padding:0 5px;font-size:10px}.swap:hover{border-color:var(--sub)}
.rb{display:inline-block;min-width:38px;text-align:center;padding:1px 6px;font-size:12px;border:0;font-family:inherit;line-height:1.6}
select.rb{appearance:none;-webkit-appearance:none;cursor:pointer;padding:2px 8px}
.rb1{background:#F2C14E;color:#2A1E00}.rb2{background:#C4CBD6;color:#1E1F22}.rb3{background:#C98A55;color:#2A1600}.rbx{background:#4A4D53;color:#C4C7CC}.rb0{background:transparent;color:var(--dim);border:1px dashed #4A4D53}
table.imp td{padding:3px 4px}@keyframes fl{from{opacity:.4}to{opacity:1}}
</style>
</head>

<script type="module">
/* =====================================================
   設定：Firebaseの設定をここに貼り付けます。
   空のままだと「お試しモード」（この端末のブラウザだけに保存）で動きます。
   ===================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCR-RL-mwSVuTFxkV4Us8zh0eKksBzjxR0",
  authDomain: "asobiba-304ad.firebaseapp.com",
  databaseURL: "https://asobiba-304ad-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "asobiba-304ad",
  storageBucket: "asobiba-304ad.firebasestorage.app",
  messagingSenderId: "119688179542",
  appId: "1:119688179542:web:f3051e5ec10e3ed3a6f0f7"
};
const ROOT = "gamenight";          // データベース内の保存場所（遊び場と共用しても混ざらないように分ける）
const SITE_NAME = "GAME NIGHT";    // サイト名（仮）

/* ---------------- データ保存（Firebase / お試しモード） ---------------- */
const LOCAL_KEY = "gamenight-local-db";
const PREF_KEY = "gamenight-pref";
const Store = {
  mode: "local", data: null, onChange: () => {},
  async init() {
    if (FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL) {
      const v = "10.12.2";
      const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
      const db = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-database.js`);
      const app = initializeApp(FIREBASE_CONFIG);
      this.db = db; this.ref = db.ref(db.getDatabase(app), ROOT); this.mode = "firebase";
      db.onValue(this.ref, snap => { this.data = snap.val() || {}; this.onChange(); },
        err => { showFatal("データベースに接続できません：" + err.message); });
    } else {
      this.mode = "local";
      this.data = loadLocal();
      window.addEventListener("storage", e => { if (e.key === LOCAL_KEY) { this.data = loadLocal(); this.onChange(); } });
      setTimeout(() => this.onChange(), 0);
    }
  },
  // updates: { "a/b/c": 値 or null(削除) }
  async update(updates) {
    if (this.mode === "firebase") return this.db.update(this.ref, updates);
    const d = structuredClone(this.data);
    for (const [p, v] of Object.entries(updates)) setPath(d, p, v);
    this.data = d; localStorage.setItem(LOCAL_KEY, JSON.stringify(d)); this.onChange();
  }
};
function loadLocal() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch { return {}; } }
function setPath(obj, path, val) {
  const ks = path.split("/"); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== "object" || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
  const last = ks[ks.length - 1];
  if (val === null || val === undefined) delete o[last]; else o[last] = val;
}

/* ---------------- 画面の状態 ---------------- */
const S = {
  view: "access", groupId: null, eventId: null, me: null,
  accessCode: "", accessGroup: null, unlocked: {}, gfilter: "all", accessPick: null, remember: true,
  gnew: null, setup: null, imp: null, draft: null, editRound: null, stTab: "rank",
  viewEventId: null, recMember: null, drawing: null, err: ""
};
const pref = (() => { try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { return {}; } })();
function savePref() { localStorage.setItem(PREF_KEY, JSON.stringify(pref)); }

/* ---------------- 便利関数 ---------------- */
const D = () => Store.data || {};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, "0");
const now = () => Date.now();
const fmtDate = t => { if (!t) return "-"; const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
const fmtYMD = t => { const d = new Date(t); return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`; };
const fmtDateTime = t => { const d = new Date(t); return `${fmtYMD(t)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const isoDate = t => { const d = new Date(t); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const mname = id => D().members?.[id]?.name ?? "（不明）";
const shortId = id => "ID-" + String(id).slice(-3).toUpperCase();
const grpOf = id => D().groups?.[id];
const grp = () => grpOf(S.groupId);
const evOf = id => D().events?.[id];
const curEv = () => evOf(S.eventId);
const groupMembers = g => Object.entries(g?.members || {}).sort((a, b) => a[1] - b[1]).map(([id]) => id);
const groupGames = g => Object.entries(g?.games || {}).map(([id, x]) => ({ id, ...x })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
const groupEvents = gid => Object.entries(D().events || {}).filter(([, e]) => e.groupId === gid).map(([id, e]) => ({ id, ...e })).sort((a, b) => b.startedAt - a.startedAt);
const playersOf = e => Object.entries(e?.players || {}).sort((a, b) => a[1] - b[1]).map(([id]) => id);
const roundsOf = e => Object.entries(e?.rounds || {}).map(([id, r]) => ({ id, ...r })).sort((a, b) => a.at - b.at);
const gameOf = (e, gameId) => grpOf(e?.groupId)?.games?.[gameId];
const multBadge = m => (m && m > 1) ? `<span class="bdg">×${m}</span>` : "";
const rbClass = r => r === 1 ? "rb1" : r === 2 ? "rb2" : r === 3 ? "rb3" : r > 0 ? "rbx" : "rb0";
const rankBadge = (r, label, big) => `<span class="rb ${rbClass(r)}" style="${big ? "font-size:14px;padding:2px 10px" : ""}">${label ?? (r > 0 ? r + "位" : "不参加")}</span>`;
const PALETTE = ["#E8590C", "#2E8FD8", "#2F9E44", "#AE3EC9", "#F2C14E", "#E64980", "#15AABF", "#868E96"];
function colorOf(id) {
  const m = D().members?.[id]; if (m?.color) return m.color;
  const g = grp(); const idx = g ? groupMembers(g).indexOf(id) : -1;
  const h = [...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0);
  return PALETTE[(idx >= 0 ? idx : h) % PALETTE.length];
}
const handleOf = id => D().members?.[id]?.handle || ("u" + String(id).slice(-3).toLowerCase());
function avatar(id, size = 28) {
  const m = D().members?.[id]; const c = colorOf(id);
  const inner = m?.icon ? `<img src="${esc(m.icon)}" alt="">` : esc((m?.name || "?").slice(0, 1));
  return `<span class="av" style="width:${size}px;height:${size}px;border-color:${c};background:${m?.icon ? "#3A3D42" : c};font-size:${Math.round(size * .45)}px">${inner}</span>`;
}
function who(id, size = 22, showHandle = true) {
  return `<span class="who">${avatar(id, size)}<span class="whon">${esc(mname(id))}${showHandle ? `<span class="hdl">@${esc(handleOf(id))}</span>` : ""}</span></span>`;
}
const youTag = id => id === S.me ? '<span class="you">YOU</span>' : "";

// 1ゲームの得点：参加人数Nのとき 順位r → (N - r + 1) × 倍率。同じ順位は同じ点。
function roundPoints(r) {
  const ent = Object.entries(r.ranks || {}).filter(([, v]) => v > 0);
  const n = ent.length, m = r.mult || 1, out = {};
  for (const [id, rk] of ent) out[id] = Math.max(0, n - rk + 1) * m;
  return out;
}
function standingsOf(e, rs) {
  const ps = playersOf(e), t = {}; ps.forEach(p => t[p] = 0);
  rs.forEach(r => { const p = roundPoints(r); for (const k in p) if (k in t) t[k] += p[k]; });
  const arr = ps.map(id => ({ id, pts: t[id] })).sort((a, b) => b.pts - a.pts);
  arr.forEach((x, i) => x.rank = (i > 0 && x.pts === arr[i - 1].pts) ? arr[i - 1].rank : i + 1);
  return arr;
}
function withMoves(e) {
  const rs = roundsOf(e), cur = standingsOf(e, rs);
  if (rs.length < 2) return cur.map(x => ({ ...x, move: 0 }));
  const prev = Object.fromEntries(standingsOf(e, rs.slice(0, -1)).map(x => [x.id, x.rank]));
  return cur.map(x => ({ ...x, move: prev[x.id] - x.rank }));
}
function winnersText(e) { const st = standingsOf(e, roundsOf(e)); return st.filter(x => x.rank === 1 && x.pts > 0).map(x => mname(x.id)).join("・"); }
function remainingPool(e) {
  const played = new Set(roundsOf(e).map(r => r.gameId));
  return Object.keys(e?.pool || {}).filter(g => gameOf(e, g) && !played.has(g));
}
function poolSize(e) {
  const pool = Object.keys(e?.pool || {}).filter(g => gameOf(e, g));
  const extra = roundsOf(e).filter(r => !pool.includes(r.gameId)).length;
  return pool.length + extra;
}

const catsOf = g => g?.categories ? Object.entries(g.categories).map(([id, c]) => ({ id, ...c })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)) : DEFAULT_CATS;

async function hashPass(gid, pw) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(`gamenight:${gid}:${pw}`));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function groupLastAt(gid) { const evs = groupEvents(gid); return evs.length ? Math.max(...evs.map(e => e.updatedAt || e.startedAt || 0)) : (grpOf(gid)?.createdAt || 0); }

function viewGames() {
  const g = grp(); const e = curEv(); const played = new Set(roundsOf(e).map(r => r.gameId));

  const f = S.gfilter || "all";

  const cnt = cid => all.filter(x => cid === "none" ? !catOf(g, x.cat) : x.cat === cid).length;
  const tab = (key, label, color) => `<button class="ftab ${f === key ? "on" : ""}" data-act="gfilter" data-f="${key}">${color ? `<span class="sq" style="background:${color}"></span>` : ""}${esc(label)} <span class="mono">${key === "all" ? all.length : cnt(key)}</span></button>`;
  const catSel = x => `<select class="field" style="padding:3px 4px;font-size:12px;border-left:4px solid ${catOf(g, x.cat)?.color || "#868E96"}" data-chg="gcat" data-id="${x.id}">

  return `${header("ゲームマスタ / GAME MASTER", e ? "menu" : "hub")}

/* ----- 結果入力 ----- */

  const e = evOf(S.editRound ? S.editEvent : S.eventId); if (!e) return `${header("結果入力 / RESULT", "hub")}<p>大会が見つかりません</p>`;
  const ps = playersOf(e);
  const target = S.editRound ? e.rounds?.[S.editRound] : e.current;
  if (!target || !target.name) {
    return `${header("結果入力 / RESULT", "menu")}<div class="row">先に「抽選」で次のゲームを決めてください${target && target.isFree ? "（自由枠のゲーム名が未入力です）" : ""}</div>
      <div style="margin-top:12px"><button class="btn" data-act="go" data-v="draw">抽選へ</button></div>`;

        <button class="rk x ${dr[id] === 0 ? "on" : ""}" data-act="rank" data-id="${id}" data-r="0">不参加</button></span></div>`).join("")}
      <p class="muted" style="font-size:12px;margin:4px 0 0">同じ順位は重ねて選べます。抜けた人は「不参加」にすると、残りの人数で点数を計算します。</p>

          ${ps.filter(id => dr[id] > 0).sort((a, b) => prev[b] - prev[a]).map(id => `<div style="display:flex;justify-content:space-between;align-items:center">${who(id, 20, false)}<span>+${prev[id]}</span></div>`).join("") || `<span style="color:#8A8D93">順位を選ぶと表示されます</span>`}

      <p class="err">${esc(S.err)}</p>

/* ----- 集計（開催中・過去） ----- */
function viewStandings() {
  const id = S.viewEventId || S.eventId; const e = evOf(id);
  if (!e) return `${header("集計 / STANDINGS", "hub")}<p>大会が見つかりません</p>`;
  const ro = !!S.viewEventId; const done = e.status === "done";
  const st = withMoves(e); const rs = roundsOf(e);
  const order = st.map(x => x.id);
  const mv = x => !ro && x.move > 0 ? `<span style="color:var(--green);font-size:11px">▲${x.move}</span>` : !ro && x.move < 0 ? `<span style="color:#F27C7C;font-size:11px">▼${-x.move}</span>` : "";
  const top = st.filter(x => x.rank === 1), rest = st.filter(x => x.rank > 1);
  const winLabel = done ? "WINNER / 優勝" : "LEADER / 暫定1位";
  const topCards = top.map(x => `<div class="wincard">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;letter-spacing:2px">${winLabel}</span><span class="mono" style="font-size:11px">RANK 01 ${mv(x)}</span></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px">${avatar(x.id, 46)}<div style="min-width:0"><div style="font-size:20px;font-weight:700;line-height:1.2">${esc(mname(x.id))}${youTag(x.id)}</div><div class="mono" style="font-size:11px">@${esc(handleOf(x.id))}</div></div>
      <div class="mono" style="margin-left:auto;font-size:40px;line-height:1">${x.pts}<span style="font-size:13px">点</span></div></div></div>`).join("");
  const restCards = rest.map(x => `<div class="card" style="border-top-color:${x.rank === 2 ? "#C4CBD6" : x.rank === 3 ? "#C98A55" : "#4A4D53"}">
      <div style="display:flex;justify-content:space-between;align-items:center">${rankBadge(x.rank)}${mv(x)}</div>
      <div style="margin-top:6px">${who(x.id, 24)}${youTag(x.id)}</div>
      <div class="mono" style="font-size:24px;margin-top:2px">${x.pts}<span style="font-size:11px">点</span></div></div>`).join("");
  // ゲームごと（昇順）＋累計
  const cum = {}; order.forEach(p => cum[p] = 0);
  const rows = rs.map((r, i) => {
    const p = roundPoints(r); const best = Math.max(0, ...Object.values(p)); const m = r.mult || 1;
    order.forEach(pid => { if (p[pid]) cum[pid] += p[pid]; });
    const cells = order.map(pid => {
      const rk = r.ranks?.[pid];
      if (!(rk > 0)) return `<td><span class="dim" style="font-size:12px">不参加</span><div class="cum">累計 ${cum[pid]}</div></td>`;
      const win = p[pid] === best && best > 0;
      return `<td class="${win ? "wincell" : ""}"><span class="pts">+${p[pid]}<small>点</small></span> ${rankBadge(rk)}
        <div class="cum">${m > 1 ? `${p[pid] / m}×${m}　` : ""}累計 ${cum[pid]}</div></td>`;
    }).join("");

function rankLetter(v) { return v >= .8 ? "S" : v >= .6 ? "A" : v >= .4 ? "B" : v >= .2 ? "C" : "D"; }
function recordStats(gid) {
  const g = grpOf(gid); const stat = {};
  const ensure = id => stat[id] ||= { id, ev: 0, win: 0, sum: 0, games: {} };
  groupMembers(g).forEach(ensure);
  for (const e of groupEvents(gid)) {
    const rs = roundsOf(e);
    if (e.status === "done") for (const x of standingsOf(e, rs)) { const s = ensure(x.id); s.ev++; s.sum += x.pts; if (x.rank === 1 && x.pts > 0) s.win++; }
    for (const r of rs) {
      const ent = Object.entries(r.ranks || {}).filter(([, v]) => v > 0); const n = ent.length; if (n < 2) continue;
      for (const [id, rk] of ent) { const gm = ensure(id).games[r.name] ||= { n: 0, s: 0 }; gm.n++; gm.s += (n - rk) / (n - 1); }
    }
  }
  const avg = s => s.ev ? s.sum / s.ev : 0;
  const order = Object.values(stat).sort((a, b) => b.win - a.win || avg(b) - avg(a));
  return { stat, order, done: groupEvents(gid).filter(e => e.status === "done").length };
}

function normName(s) { return String(s).replace(/^[①-⑳⓪\s]+/, "").replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\s*[（(]\s*\d+\s*倍\s*[）)]\s*$/, "").trim(); }
const nameKey = s => String(s).normalize("NFKC").replace(/\s+/g, "").toLowerCase();
// mode: "points"＝数字は点数（高いほど上位）、"rank"＝数字は順位（小さいほど上位）
function parseImport(text, n, mode) {
  const rows = []; let totals = null;
  const toNum = c => { const t = String(c ?? "").trim().replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)); return t === "" ? null : (/^-?\d+(\.\d+)?$/.test(t) ? Number(t) : NaN); };
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    let name, cells;
    if (line.includes("\t")) { const c = line.split("\t"); name = c[0]; cells = c.slice(1); }
    else { const t = line.trim().split(/\s+/); const i = t.findIndex(x => toNum(x) !== null && !isNaN(toNum(x))); if (i <= 0) continue; name = t.slice(0, i).join(" "); cells = t.slice(i); }
    const rawName = String(name); name = normName(name);
    const vals = Array.from({ length: n }, (_, i) => toNum(cells[i]));
    if (!name) continue;
    if (/合計/.test(name)) { if (vals.every(v => v !== null && !Number.isNaN(v))) totals = vals; continue; }
    if (vals.some(v => Number.isNaN(v)) || vals.every(v => v === null)) continue; // 見出し行など
    const present = vals.filter(v => v !== null); const m = present.length;
    const sum = present.reduce((a, b) => a + b, 0); const base = m * (m + 1) / 2;
    // 倍率の判定：割り切れて、割った値がすべて1〜参加人数に収まる倍率の中から、合計が「1〜人数の合計」に最も近いものを選ぶ（同点があっても判定できる）
    const hint = (rawName.match(/[（(]\s*([2-3２-３])\s*倍\s*[）)]/) || [])[1];
    const cands = [1, 2, 3].filter(c => present.every(v => v % c === 0 && v / c >= 1 && v / c <= m));
    let k = cands.length ? cands.reduce((a, c) => Math.abs(sum / c - base) < Math.abs(sum / a - base) ? c : a) : 1;
    if (hint) { const h = Number(String(hint).replace(/[２-３]/, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0))); if (cands.includes(h)) k = h; }
    let warn = "";
    const rk = vals.map(v => {
      if (v === null) return 0; const q = v / k;
      if (q < 1 || q > m || !Number.isInteger(q)) { warn = `${mode === "points" ? "点数" : "順位"}として読めない数字があります（${vals.map(x => x ?? "空").join("・")}）。直してください`; return 1; }
      return mode === "points" ? m - q + 1 : q;
    });
    if (m < 2) warn = "参加者が2人未満です";
    const isFree = /自由枠/.test(name);
    rows.push({ name: isFree ? "自由枠" : name, mult: k, rk, warn,
      note: isFree ? "自由枠：実際に遊んだゲーム名に書き換えできます" : k > 1 ? `${k}倍を検出（${vals.join("・")} を${k}で割って変換）` : "" });
  }
  return { rows, totals };
}

function resizeIcon(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("画像を読み込めませんでした"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("この画像は使えません"));
      img.onload = () => {

  /* 過去の大会の登録 */
  newImport: () => { const g = grp(); S.imp = { title: `第${groupEvents(S.groupId).length + 1}回大会`, date: isoDate(now()), players: groupMembers(g).slice(0, 6), text: "", rows: [], mode: "points", excelTotals: null }; go("imp"); },
  impPlayer: d => { const p = S.imp.players; const i = p.indexOf(d.id); if (i >= 0) p.splice(i, 1); else if (p.length < 6) p.push(d.id); S.imp.rows.forEach(r => { for (const k in r.ranks) if (!p.includes(k)) delete r.ranks[k]; }); render(true); },
  impMode: d => { S.imp.mode = d.m; if (S.imp.text.trim() && S.imp.rows.length) { actions.impParse(); toast(d.m === "points" ? "点数として読み直しました" : "順位として読み直しました"); } else render(true); },
  impParse: () => {
    const im = S.imp; if (im.players.length < 2) { S.err = "参加者を2人以上選んでください"; return render(true); }
    const { rows, totals } = parseImport(im.text, im.players.length, im.mode);
    if (!rows.length) { S.err = "読み取れる行がありませんでした。ゲーム名と数字の範囲をコピーしてください"; return render(true); }
    im.excelTotals = totals;
    im.rows = rows.map(r => ({ name: r.name, mult: r.mult, warn: r.warn, note: r.note, addCand: true, ranks: Object.fromEntries(im.players.map((p, i) => [p, r.rk[i]])) }));
    S.err = ""; toast(`${rows.length}行を読み取りました`); render(true);
  },
  impAddRow: () => { const im = S.imp; if (im.players.length < 2) { S.err = "参加者を2人以上選んでください"; return render(true); }
    im.rows.push({ name: "", mult: 1, addCand: true, ranks: Object.fromEntries(im.players.map((p, i) => [p, i + 1])) }); S.err = ""; render(true); },
  impDelRow: d => { S.imp.rows.splice(Number(d.ri), 1); render(true); },
  impCandAll: d => { S.imp.rows.forEach(r => r.addCand = d.v === "1"); render(true); },
  impSave: async () => {
    const im = S.imp, g = grp(), ps = im.players;
    if (ps.length < 2) { S.err = "参加者を2人以上選んでください"; return render(true); }
    if (!im.rows.length) { S.err = "ゲームの行がありません"; return render(true); }
    for (const [i, r] of im.rows.entries()) {
      if (!r.name.trim()) { S.err = `${i + 1}行目のゲーム名が空です`; return render(true); }
      const vals = ps.map(p => r.ranks[p] || 0); const m = vals.filter(v => v > 0).length;
      if (m < 2) { S.err = `${i + 1}行目（${r.name}）は参加者が2人以上必要です`; return render(true); }
      if (vals.some(v => v > m)) { S.err = `${i + 1}行目（${r.name}）は参加${m}人なので、順位は1〜${m}で選んでください`; return render(true); }
    }
    const start = new Date(im.date + "T12:00:00").getTime() || now();
    const byName = Object.fromEntries(groupGames(g).map(x => [nameKey(x.name), x]));
    const u = {};
    im.rows.forEach((r, i) => { const key = nameKey(r.name); if (byName[key] || r.addCand === false) return;
      const gid = uid() + "n" + i; const x = { name: r.name.trim(), mult: r.mult, isFree: /自由枠/.test(r.name), order: now() + i };
      u[`groups/${S.groupId}/games/${gid}`] = x; byName[key] = { id: gid, ...x }; });
    const rounds = {};
    im.rows.forEach((r, i) => { const hit = byName[nameKey(r.name)]; rounds[uid() + i] = { gameId: hit?.id || "", name: hit ? hit.name : r.name.trim(), mult: r.mult, ranks: Object.fromEntries(ps.map(p => [p, r.ranks[p] || 0])), at: start + i }; });
    const id = uid();
    await Store.update({ ...u, [`events/${id}`]: { groupId: S.groupId, title: im.title.trim() || "過去の大会", status: "done", imported: true, startedAt: start, endedAt: start, updatedAt: now(),
      players: Object.fromEntries(ps.map((p, i) => [p, i])), pool: {}, rounds } });
    toast("過去の大会を登録しました"); S.viewEventId = id; S.stTab = "rank"; S.view = "standings"; render(true);
  }
};
function impReassign(ci, newId) {
  const im = S.imp, ps = im.players, old = ps[ci]; if (!newId || old === newId) return;
  const cj = ps.indexOf(newId);
  im.rows.forEach(r => { const a = r.ranks[old]; if (cj >= 0) { const b = r.ranks[newId]; r.ranks[newId] = a; r.ranks[old] = b; } else { r.ranks[newId] = a; delete r.ranks[old]; } });
  if (cj >= 0) { ps[ci] = newId; ps[cj] = old; } else ps[ci] = newId;
}
const setByPath = (path, v) => { const [a, b] = path.split("."); S[a][b] = v; };
const changes = {
  remember: el => { S.remember = el.checked; },
  gnewSeed: el => { S.gnew.seed = el.checked; },
  setupGame: el => { const g = S.setup.games; const i = g.indexOf(el.dataset.id); if (el.checked && i < 0) g.push(el.dataset.id); if (!el.checked && i >= 0) g.splice(i, 1); render(true); },
  poolToggle: el => Store.update({ [`events/${S.eventId}/pool/${el.dataset.id}`]: el.checked ? true : null }),
  mult: el => Store.update({ [`groups/${S.groupId}/games/${el.dataset.id}/mult`]: Number(el.value) }),
  groupName: el => { const v = el.value.trim(); if (v) Store.update({ [`groups/${S.groupId}/name`]: v }); },
  renameMember: el => { const v = el.value.trim(); if (v && v !== mname(el.dataset.id)) { Store.update({ [`members/${el.dataset.id}/name`]: v }); toast(`名前を「${v}」に変更しました`); } },
  impMult: el => { S.imp.rows[Number(el.dataset.ri)].mult = Number(el.value); render(true); },
  impRank: el => { const r = S.imp.rows[Number(el.dataset.ri)]; r.ranks[el.dataset.pid] = Number(el.value); r.warn = ""; render(true); },
  gcat: el => Store.update({ [`groups/${S.groupId}/games/${el.dataset.id}/cat`]: el.value || null }),
  gfield: el => { const k = el.dataset.k; const v = el.value.trim(); if (k === "name" && !v) { render(true); return; }
    Store.update({ [`groups/${S.groupId}/games/${el.dataset.id}/${k}`]: v || null }); },
  catName: el => { const v = el.value.trim(); if (v) Store.update({ [`groups/${S.groupId}/categories/${el.dataset.id}/name`]: v }); },
  impCol: el => { impReassign(Number(el.dataset.ci), el.value); render(true); },
  profIcon: async el => { const f = el.files?.[0]; if (!f) return; try { S.prof.icon = await resizeIcon(f); S.err = ""; } catch (e) { S.err = e.message; } render(true); },
  impCand: el => { S.imp.rows[Number(el.dataset.ri)].addCand = el.checked; render(true); }
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el || !app.contains(el)) return;
  if (el.disabled) return; ev.preventDefault(); const f = actions[el.dataset.act]; if (f) f(el.dataset, el);
});
document.addEventListener("change", ev => { const el = ev.target; if (el.dataset?.chg && changes[el.dataset.chg]) changes[el.dataset.chg](el); });
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "codeInput") {
    const v = el.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); const pos = el.selectionStart;
    if (v !== S.accessCode) { S.accessCode = v; S.accessPick = null; S.err = ""; renderQueued = false; render(true); const ni = document.getElementById("codeInput"); ni.focus(); ni.setSelectionRange(pos, pos); }
    return;
  }
  const p = el.dataset?.inp; if (!p) return;
  if (p === "impName") { S.imp.rows[Number(el.dataset.ri)].name = el.value; return; }
  setByPath(p, el.value);
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return; const id = ev.target.id;
  const map = { freeName: "setFree", gName: "addGame", gnewMember: "gnewAdd", cfgMember: "addMember", pwInput: "unlock", catNew: "catAdd" };
  if (map[id]) { ev.preventDefault(); actions[map[id]](); }
});

/* ---------------- 旧版データの移行（大会ごとのコード → グループ） ---------------- */
async function migrate() {
  const old = Object.entries(D().events || {}).filter(([, e]) => !e.groupId);
  if (!old.length && !D().games) return;
  const u = {}, groups = {}, byKey = {}, taken = {};
  for (const [eid, e] of old) {
    const ps = playersOf(e); const key = [...ps].sort().join(",");
    let gid = byKey[key];
    if (!gid) {
      gid = uid() + Object.keys(byKey).length; byKey[key] = gid; const code = newCode(taken); taken[code] = 1;
      groups[gid] = { name: `グループ${Object.keys(byKey).length}`, code, createdAt: now(), members: Object.fromEntries(ps.map((p, i) => [p, i])), games: D().games || {} };
      u[`codes/${code}`] = gid;
    }
    u[`events/${eid}/groupId`] = gid;
    if (e.status !== "done") { if (groups[gid].activeEvent) u[`events/${eid}/status`] = "done"; else groups[gid].activeEvent = eid; }
    if (e.code) u[`codes/${e.code}`] = null;
  }
  for (const [gid, g] of Object.entries(groups)) u[`groups/${gid}`] = g;
  u["games"] = null;
  await Store.update(u);
}

/* ---------------- 起動 ---------------- */
let booted = false;
Store.onChange = async () => {
  if (!booted) {
    booted = true;
    try { await migrate(); } catch (err) { console.error(err); }
    const q = new URLSearchParams(location.search).get("room");
    const qg = q && D().codes?.[q.toUpperCase()];
    if (pref.gid && grpOf(pref.gid) && grpOf(pref.gid).passHash && pref.ph === grpOf(pref.gid).passHash && grpOf(pref.gid).members?.[pref.member] !== undefined && (!qg || qg === pref.gid)) {
      history.replaceState(null, "", location.pathname); enterGroup(pref.gid, pref.member); return;
    }
    if (qg && grpOf(qg)) { S.accessGroup = qg; history.replaceState(null, "", location.pathname); }
  }
  render();
};
Store.init().catch(err => showFatal("起動に失敗しました：" + err.message));
</script>
